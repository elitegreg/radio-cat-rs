[package]
name = "radio-cat-rs"
version = "0.1.0"
edition = "2021"
description = "Async CAT control library for amateur radios"
license = "MIT"

[dependencies]
async-trait = "0.1"
thiserror = "1.0"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-serial = "5"
